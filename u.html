<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SleeveX showcase</title><link rel="stylesheet" href="style.css">
<style>.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px;margin-top:20px}
.grid img{width:100%;aspect-ratio:5/7;object-fit:cover;border-radius:8px;background:var(--card)}
.n{font-size:12px;color:var(--muted)}.p{font-weight:700;color:var(--gold)}</style></head>
<body><main>
<nav><a href="index.html">SleeveX</a></nav>
<h1 id="t">Showcase</h1><div id="who" class="muted"></div>
<div id="msg" class="muted">Loading…</div><div id="grid" class="grid"></div>
<p class="muted" style="margin-top:32px;font-size:13px">Prices are estimates. Unofficial fan app, not affiliated with Bandai. Card images belong to their owners.</p>
</main>
<script>
// The publishable key is safe in a public page: the database only lets visitors read what is public.
const URL_ = 'https://ayirdymsowuqkjrqjywi.supabase.co';
const KEY = 'sb_publishable_Rh7pgcCv90b7KAmfr9n9uA_Toz5OtCy';
const H = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };
const name = (new URLSearchParams(location.search).get('name') || '').toLowerCase();
const msg = document.getElementById('msg');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
(async () => {
  if (!/^[a-z0-9_]{3,20}$/.test(name)) { msg.textContent = 'No showcase here.'; return; }
  try {
    const r = await fetch(URL_ + '/rest/v1/rpc/get_showcase', { method: 'POST', headers: H, body: JSON.stringify({ name }) });
    const s = await r.json();
    if (!r.ok || !s) { msg.textContent = '@' + name + ' does not exist, or keeps their showcase private.'; return; }
    document.title = s.title + ' · SleeveX';
    document.getElementById('t').textContent = s.title;
    document.getElementById('who').textContent = (s.display_name || s.username) + ' · @' + s.username;
    const ids = s.product_ids || [];
    if (!ids.length) { msg.textContent = 'No cards here yet.'; return; }
    const pr = await fetch(URL_ + '/rest/v1/catalogue_products?select=id,name,number,image_url,price_usd_cents&id=in.(' + ids.join(',') + ')', { headers: H });
    const rows = await pr.json();
    const by = Object.fromEntries(rows.map(x => [x.id, x]));
    msg.remove();
    document.getElementById('grid').innerHTML = ids.filter(i => by[i]).map(i => {
      const p = by[i];
      const price = s.show_prices && p.price_usd_cents != null ? '<div class="p">$' + (p.price_usd_cents / 100).toFixed(2) + '</div>' : '';
      return '<div>' + (p.image_url ? '<img loading="lazy" alt="' + esc(p.name) + '" src="' + esc(p.image_url) + '">' : '') + '<div class="n">' + esc(p.number || p.name) + '</div>' + price + '</div>';
    }).join('');
  } catch (e) { msg.textContent = 'Could not load this showcase. Check your connection.'; }
})();
</script></body></html>
